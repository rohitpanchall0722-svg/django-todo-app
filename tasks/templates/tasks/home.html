<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        .done { text-decoration: line-through; color: gray; }
        form.inline { display: inline; }
    </style>
</head>
<body>
    <h1>My To-Do List</h1>

    <form method="post" action="{% url 'add_task' %}">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Add new task here..." maxlength="200" required>
        <button type="submit">Add</button>
    </form>

    {% if tasks %}
        <ul>
            {% for task in tasks %}
                <li>
                    <span class="{% if task.completed %}done{% endif %}">{{ task.title }}</span>

                    <form class="inline" method="post" action="{% url 'toggle_task' task.id %}">
                        {% csrf_token %}
                        <button type="submit">
                            {% if task.completed %}Undo{% else %}Done{% endif %}
                        </button>
                    </form>

                    <form class="inline" method="post" action="{% url 'delete_task' task.id %}">
                        {% csrf_token %}
                        <button type="submit">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Right now there is on task.</p>
    {% endif %}
</body>
</html>
